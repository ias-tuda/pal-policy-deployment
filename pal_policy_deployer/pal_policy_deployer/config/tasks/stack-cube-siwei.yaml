# A task: what the robot is asked to do with a robot part. The file name is the task name and
# the recording folder; see pickandplace-wc-abs-c-s78.yaml for what each key does.
robot: left_arm_nogravcomp
instruction: Stack the cube on top of the other cube
# oopsie-data counts a different instruction or scene layout as a distinct task (at most 200
# episodes count per task). The instruction is that of stack-cube (another model).
scene: {arrangement: A}

# The model contract. It must match the robot part: joint set and order, and gravity
# compensation (trained without it, so the robot is left_arm_nogravcomp). Order matters.
model:
  # pp_s91_SC-FT_s1_it4500 (pal_mjlab Mjlab-PickPlace-Pal-Kangaroo-Grippers, S9.1 SC-FT, see
  # deployment_info.yaml beside the model): stacking cube_1 on a base cube, resumed from DEP1
  # STSA-c. Left arm and left jaw, absolute joint targets, G20 gains, the stack task's slew
  # rates, observations in base_link (38): the deployment contract of pickandplace-dep1-wc-c-s1
  # (commanded target observed, CMD_OBS=cmd), with goal_pos_b the stacking goal.
  model_path: /catkin_ws/src/models/siwei-stack/pp_s91_SC-FT_s1_it4500/model_4500.onnx
  observation_terms: [joint_pos_rel, joint_vel, joint_target_rel, tcp_pos_b, tcp_quat_b, object_pos_b, object_yaw_b, goal_pos_b]
  action_dim: 8
  action_mode: joint_position
  # Training's effort band torque is the joint actfrcrange, 0.7 of the actuator effort_limit
  # (EFFORT=CTP: 35 Nm on arm 1-2, 17.5 Nm on arm 3-7); env.yaml records only effort_limit.
  effort_band_fraction: 0.7
  # The training ee_orientation_b makes w >= 0.
  tcp_quat_sign: w_positive

# cube_1 is the cube that is grasped, cube_2 the base cube it is stacked on (both TF origins at
# the cube centre). The policy's goal is the base cube's top centre plus the cube's half-height,
# on the robot cube_2's tracked centre + 0.05 m (deployment_info.yaml: target_pos). The goal
# follows cube_2 (low-passed), so a nudged base cube moves it.
object_frame: cube_1
# The training cube yaw covered +-pi/4; fold the tracked yaw of the symmetric cube into it.
object_yaw_symmetry: 4
base_object_frame: cube_2
goal_offset_b: [0.0, 0.0, 0.05]
track_base_object: true
base_object_alpha: 0.1   # low-pass on the followed goal per tick (1 = none)
# Beyond object_timeout the inferer skips steps and the supervisor stops the policy after
# running_timeout. Training (LAG=FP+JS, split tracker) saw a lag on the object terms.
object_timeout: 2.0

supervisor:
  # Start is blocked only when a feature is outside the training [min, max] widened by these
  # margins; smaller misses are shown as notes.
  ood_margin: 0.05
  ood_margins:
    joint_pos_rel: 0.15      # rad
    joint_vel: 0.3           # rad/s
    joint_target_rel: 0.15   # rad
    tcp_pos_b: 0.03          # m
    tcp_quat_b: 0.1
    object_pos_b: 0.03       # m
    object_yaw_b: 0.2
    goal_pos_b: 0.02         # m
  # While the policy runs, stop it when cube_1 leaves the box of the training start ranges of
  # the cube and the goal, widened by the margin, for running_ood_frames frames, or when no
  # observation (stale joint state or TF) arrives.
  running_ood_terms: [object_pos_b]
  running_ood_margin: 0.3    # m
