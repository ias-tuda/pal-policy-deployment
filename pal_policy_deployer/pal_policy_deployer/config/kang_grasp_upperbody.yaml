model_path: /catkin_ws/src/models/kangaroo_grasp_upper_body_standing/2026-09-28_11-57-28_grasp-upperbody-standing-armv36-slow50-notable-binjaw-scratch_s42/model_700.onnx

# Model contract of Mjlab-Grasp-UpperBody-Standing-ArmV36-Pal-Kangaroo-Grippers at pal_mjlab
# commit dfac6068: waist, both arms and both jaws, no gravity feedforward. Order matters.
joint_names: [pelvis_1_joint, pelvis_2_joint,
              arm_left_1_joint, arm_left_2_joint, arm_left_3_joint, arm_left_4_joint, arm_left_5_joint, arm_left_6_joint, arm_left_7_joint,
              gripper_left_finger_joint,
              arm_right_1_joint, arm_right_2_joint, arm_right_3_joint, arm_right_4_joint, arm_right_5_joint, arm_right_6_joint, arm_right_7_joint,
              gripper_right_finger_joint]
arm_joint_names: [arm_left_1_joint, arm_left_2_joint, arm_left_3_joint, arm_left_4_joint, arm_left_5_joint, arm_left_6_joint, arm_left_7_joint,
                  arm_right_1_joint, arm_right_2_joint, arm_right_3_joint, arm_right_4_joint, arm_right_5_joint, arm_right_6_joint, arm_right_7_joint]
joint_vel_names: [pelvis_1_joint, pelvis_2_joint,
                  arm_left_1_joint, arm_left_2_joint, arm_left_3_joint, arm_left_4_joint, arm_left_5_joint, arm_left_6_joint, arm_left_7_joint,
                  arm_right_1_joint, arm_right_2_joint, arm_right_3_joint, arm_right_4_joint, arm_right_5_joint, arm_right_6_joint, arm_right_7_joint]
observation_terms: [joint_pos_rel, joint_vel, last_action, joint_target_rel, tcp_pos_b, object_pos_b, object_yaw_b, goal_pos_b, tcp_quat_b]
action_dim: 18

# DeltaJointPositionAction on actions[0:16]: target = clip(target + action_scale * clip(action, -1, 1)).
# The inferer reads action_scale (scale * scale_multiplier, rad per 50 Hz step) from
# params/env.yaml beside the model, so it cannot drift from the checkpoint.
action_mode: delta_joint_position
action_joint_names: [pelvis_1_joint, pelvis_2_joint,
                     arm_left_1_joint, arm_left_2_joint, arm_left_3_joint, arm_left_4_joint, arm_left_5_joint, arm_left_6_joint, arm_left_7_joint,
                     arm_right_1_joint, arm_right_2_joint, arm_right_3_joint, arm_right_4_joint, arm_right_5_joint, arm_right_6_joint, arm_right_7_joint]
# Soft joint limits (0.9 of the MJCF range about its centre).
target_lower: [-0.314159, -1.1781,
               -2.356191, -0.955564, -2.356191, -0.955564, -2.356191, -1.640613, -2.356191,
               -2.356191, -0.955564, -2.356191, -0.955564, -2.356191, -1.640613, -2.356191]
target_upper: [0.314159, 1.1781,
               2.356191, 2.264564, 2.356191, 2.264564, 2.356191, 2.757624, 2.356191,
               2.356191, 2.264564, 2.356191, 2.264564, 2.356191, 2.757624, 2.356191]
# The gravity PD pre-load the policy starts from, qfrc_bias / kp at the start pose: mean of
# joint_target minus joint_pos in start_observation_distribution.json. Added to the measured
# position to seed the target, so the handover holds the pose without a gravity bridge.
target_preload: [0.003, 0.0,
                 -0.092, 0.027, 0.010, 0.110, -0.012, -0.050, 0.0,
                 0.090, 0.019, -0.012, 0.109, 0.002, -0.052, 0.0]
# BinaryJawAction on actions[16:18]: action > 0 closes, otherwise opens, the target moving by
# at most actions.gripper.rate_limit per step (read from params/env.yaml). Open and closed are
# the soft limits narrowed by the clip, from the run's named ONNX metadata
# (gripper_open_pos, gripper_closed_pos); model_300.onnx does not carry them.
gripper_joint_names: [gripper_left_finger_joint, gripper_right_finger_joint]
gripper_open_pos: [0.048, 0.048]
gripper_closed_pos: [0.902, 0.902]
command_topic: /subscriber_controller/desired_state
preview_topic: /pal_policy/desired_state
publish_commands: false

# Joints the spawner puts under direct_impedance_control with the env.yaml gains. The jaws
# run in DirectPositionControl instead.
impedance_joint_names: [pelvis_1_joint, pelvis_2_joint,
                        arm_left_1_joint, arm_left_2_joint, arm_left_3_joint, arm_left_4_joint, arm_left_5_joint, arm_left_6_joint, arm_left_7_joint,
                        arm_right_1_joint, arm_right_2_joint, arm_right_3_joint, arm_right_4_joint, arm_right_5_joint, arm_right_6_joint, arm_right_7_joint]

robot_description: robot_description
base_link: base_link
tip_links: [arm_left_7_link, arm_right_7_link]
tcp_offset: [0.0, 0.0, 0.148]
joint_state_topic: /joint_states
action_topic: /pal_policy/raw_actions
policy_rate: 50.0
state_timeout: 0.1

