# Values from Mjlab-Grasp-Pal-Kangaroo-Grippers at training commit d0301718.
# The IK scales must match the policy's training run: a policy trained before d0301718
# expects delta_position_scale 0.01, delta_orientation_scale 0.05, max_dq 0.02.
base_link: base_link
tip_link: arm_left_7_link
tcp_offset: [0.0, 0.0, 0.148]

action_topic: /pal_policy/raw_actions
joint_state_topic: /simulator/joint_states
command_topic: /pal_grasp/desired_state_uncompensated
preview_topic: /pal_training_ik/desired_state

ik_rate: 500.0
state_timeout: 0.10
action_timeout: 0.10

delta_position_scale: 0.03
delta_orientation_scale: 0.15
damping: 0.05
max_dq: 0.1
position_weight: 1.0
orientation_weight: 1.0
joint_limit_weight: 1.0
posture_weight: 0.02

arm_joint_names:
  - arm_left_1_joint
  - arm_left_2_joint
  - arm_left_3_joint
  - arm_left_4_joint
  - arm_left_5_joint
  - arm_left_6_joint
  - arm_left_7_joint

posture_target: [0.102, 1.452, 1.777, 1.670, 0.458, 0.404, -0.009]

gripper_joint_name: gripper_left_finger_joint
gripper_default_position: 0.0475
gripper_scale: 0.9
gripper_lower: 0.0
gripper_upper: 0.95
gripper_max_step: 0.10
