subscriber_controller:
  type: subscriber_controller::SubscriberController
  dt: 0.0005
  controller_dt: 0.0005
  estimator_dt: 0.001
  starting_base_position: [0., 0., 0.6]
  estimated_angular_velocity_scaling_gain: 1.0
  estimated_linear_velocity_scaling_gain: 1.0
  #joint_velocity_scaling_gain: 0
  joint_velocity_scaling_gain: 1.0
  global_torque_gain: 1.0
  spawn_controller_thread: true
  spawn_estimator_thread: true
  imu_frame_name: imu_link
  imu_name: base_imu

  estimator_parameters:
    robot_model_chains: []

  contact_estimator: ""
  debug_desired_state: true
  debug_joint_name: leg_left_4_joint
  debug_joint_prefix: leg_left_
  debug_log_period: 0.5

  # Fallback PID gains (used only when no desired_state received — holds initial position)
  # Values from kangaroo_controller_configuration/config/pids.yaml
  # knee/femur joints have no_control, so gains stay 0
